# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

inheritance: true
language: "en-US"
focus: "high"
tone_instructions: >
  Use English by default because this is a public open-source organization.
  If the PR author or discussion is primarily Chinese, use Chinese. Keep
  comments concise, direct, and actionable.

reviews:
  profile: "chill"
  poem: false
  enable_prompt_for_ai_agents: false

  path_instructions:
    - path: "**/*"
      instructions: |
        Keep review noise low. Post inline comments only for P0/P1 issues:
        security vulnerabilities, privacy leaks, data loss/corruption, crashes,
        broken core functionality, clear regressions, or contract violations
        likely to break users, CI, release, or other apps.

        Do not post inline comments for P2/P3 issues, minor edge cases, style
        nits, optional refactors, nice-to-have tests, or low-risk races. Put
        lower-priority observations in the summary or omit them.

    - path: "**/tutti.app.json"
      instructions: |
        This is a Tutti workspace app surface. Use tutti-os/tutti-agent-skills
        as the review standard. Flag only P0/P1 manifest, runtime, package,
        storage, healthcheck, security, or install/startup contract issues.
        Do not require optional MCP/local-agent/CLI capabilities unless the PR
        explicitly promises them.

    - path: "**/tutti.cli.json"
      instructions: |
        Review as a Tutti app-to-app CLI contract. Flag only P0/P1 issues:
        unstable output/envelope shape, unsafe file/network access, bad timeout
        budgets, misleading readiness/status, or docs/schema/handler mismatch
        that callers are likely to hit.

    - path: "**/bootstrap.sh"
      instructions: |
        For Tutti apps, bootstrap must use documented TUTTI_APP_* runtime
        variables, bind the configured host/port, avoid startup installs, and
        start from the packaged app. Flag only issues that can break runtime
        startup or violate package/storage ownership.

  pre_merge_checks:
    docstrings:
      mode: "off"

knowledge_base:
  code_guidelines:
    enabled: true

  linked_repositories:
    - repository: "tutti-os/tutti-agent-skills"
      instructions: >
        Authoritative Tutti workspace app review standards. Apply this context
        only when a PR touches Tutti app surfaces such as tutti.app.json,
        tutti.cli.json, bootstrap.sh, packaging, TUTTI_APP_* runtime handling,
        app-local AGENTS.md, local agent/runtime integration, or release workflows.
